<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CineAI - Movie Discovery</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            🎬 CineAI
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="navbar"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="#search"
                    >
                        Search
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="#discover"
                    >
                        Discover
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <div class="container text-center">

        <h1>
            Find Your Next Favorite Movie
        </h1>

        <p>
            Search movies, discover something new,
            and get AI-powered recommendations.
        </p>


        <div
            class="search-box mx-auto"
            id="search"
        >

            <div class="input-group">

                <input
                    type="text"
                    id="movieSearch"
                    class="form-control"
                    placeholder="Search for a movie..."
                >

                <button
                    class="btn btn-primary"
                    onclick="searchMovies()"
                >
                    Search
                </button>

            </div>

        </div>

    </div>

</section>


<!-- SEARCH RESULTS -->

<section class="container py-5">

    <h2 class="section-title">
        Search Results
    </h2>

    <div
        id="searchResults"
        class="row g-4"
    ></div>

</section>


<!-- DISCOVER -->

<section
    id="discover"
    class="discover-section py-5"
>

    <div class="container">

        <h2 class="section-title">
            Discover
        </h2>

        <p style="color:rgb(193, 181, 181)">
            Find movies based on your preferences.
        </p>


        <div class="card discover-card">

            <div class="card-body">

                <div  class="row g-3">


                    <!-- Genre -->

                    <div class="col-md-4" style="color:rgb(193, 181, 181)">

                        <label  class="form-label">
                            Genre
                        </label>

                        <select
                            id="genre"
                            class="form-select"
                        >

                            <option value="">
                                Any Genre
                            </option>

                        </select>

                    </div>


                    <!-- Language -->

                    <div class="col-md-4">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            Language
                        </label>

                        <select
                            id="language"
                            class="form-select"
                        >

                            <option value="">
                                Any Language
                            </option>

                            <option value="en">
                                English
                            </option>

                            <option value="hi">
                                Hindi
                            </option>

                            <option value="ja">
                                Japanese
                            </option>

                            <option value="ko">
                                Korean
                            </option>

                            <option value="fr">
                                French
                            </option>

                            <option value="es">
                                Spanish
                            </option>

                        </select>

                    </div>


                    <!-- Rating -->

                    <div class="col-md-4">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            Minimum Rating
                        </label>

                        <select
                            id="rating"
                            class="form-select"
                        >

                            <option value="">
                                Any Rating
                            </option>

                            <option value="6">
                                6+
                            </option>

                            <option value="7">
                                7+
                            </option>

                            <option value="8">
                                8+
                            </option>

                            <option value="9">
                                9+
                            </option>

                        </select>

                    </div>


                    <!-- Year -->

                    <div class="col-md-6">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            From Year
                        </label>

                        <input
                            type="number"
                            id="yearFrom"
                            class="form-control"
                            placeholder="2000"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label" style="color:rgb(193, 181, 181)"> 
                            To Year
                        </label>

                        <input
                            type="number"
                            id="yearTo"
                            class="form-control"
                            placeholder="2026"
                        >

                    </div>


                    <!-- Runtime -->

                    <div class="col-md-6">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            Minimum Runtime
                        </label>

                        <input
                            type="number"
                            id="runtimeMin"
                            class="form-control"
                            placeholder="Minutes"
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            Maximum Runtime
                        </label>

                        <input
                            type="number"
                            id="runtimeMax"
                            class="form-control"
                            placeholder="Minutes"
                        >

                    </div>


                    <!-- Sort -->

                    <div class="col-md-6">

                        <label class="form-label" style="color:rgb(193, 181, 181)">
                            Sort By
                        </label>

                        <select
                            id="sort"
                            class="form-select"
                        >

                            <option value="popularity.desc">
                                Popularity
                            </option>

                            <option value="vote_average.desc">
                                Rating
                            </option>

                            <option value="primary_release_date.desc">
                                Newest
                            </option>

                            <option value="vote_count.desc">
                                Most Voted
                            </option>

                        </select>

                    </div>


                    <!-- Button -->

                    <div class="col-md-6 d-flex align-items-end">

                        <button
                            class="btn btn-primary w-100"
                            onclick="discoverMovies()"
                        >
                            🔍 Discover Movies
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- DISCOVER RESULTS -->

<section class="container py-5">

    <div
        id="discoverResults"
        class="row g-4"
    ></div>

</section>


<!-- MODAL -->

<div
    class="modal fade"
    id="movieModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div
                id="movieDetails"
                class="modal-body"
            ></div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- Our JS -->

<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


</body>

</html>
